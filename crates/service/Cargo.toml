[package]
name = "monk-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
monk-core = { path = "../core" }
monk-platform = { path = "../platform" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "signal"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }
windows-service = "0.8.1"

[dev-dependencies]
tempfile = "3.27.0"
