[package]
name = "monk-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
hmac = "0.13.0"
sha2 = "0.11.1"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
thiserror = "2.0.21"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_Environment"] }
windows-registry = "0.100.0"
windows-result = "0.100.0"

[dev-dependencies]
tempfile = "3.27.0"
